{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vexa.componentName" (list . "secrets") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_API_TOKEN: {{ .Values.secrets.adminApiToken | quote }}
  # No default: `vexa-internal-secret` is published in this repository and is the exact value the
  # internal tier compares against, so a chart default IS an open internal tier (F95). Mint one
  # (`openssl rand -hex 32`) and pass --set secrets.internalApiSecret=..., or use
  # secrets.existingSecretName.
  INTERNAL_API_SECRET: {{ required "secrets.internalApiSecret is required — mint one with `openssl rand -hex 32` (or set secrets.existingSecretName); there is no default, the internal tier is authority" .Values.secrets.internalApiSecret | quote }}
  # No default, for the same reason: the gateway signs x-user-id with this key ring and
  # meeting-api and admin-api believe x-user-id only under that signature, so a published key is
  # every user's identity. The gateway refuses to start without the ring and its active kid.
  GATEWAY_IDENTITY_KEYS: {{ required "secrets.gatewayIdentityKeys is required — a JSON ring {\"<kid>\": \"<32 bytes, base64>\"}, passed with --set-file (or set secrets.existingSecretName); there is no default, the gateway signs every user's identity with it" .Values.secrets.gatewayIdentityKeys | quote }}
  GATEWAY_IDENTITY_KEY_LABEL: {{ required "secrets.gatewayIdentityActiveKey is required — the label in secrets.gatewayIdentityKeys the gateway signs with" .Values.secrets.gatewayIdentityActiveKey | quote }}
  TRANSCRIPTION_SERVICE_TOKEN: {{ .Values.secrets.transcriptionServiceToken | quote }}
  VEXA_SERVICE_AUTHORITY_SECRET: {{ .Values.secrets.serviceAuthoritySecret | quote }}
  VEXA_SYSTEM_WEBHOOK_SECRET: {{ .Values.secrets.systemWebhookSecret | quote }}
  VEXA_DISPATCH_SIGNING_KEY: {{ .Values.secrets.dispatchSigningKey | default "dev-dispatch-signing-key" | quote }}
  NEXTAUTH_SECRET: {{ .Values.secrets.nextauthSecret | default "dev-nextauth-secret" | quote }}
  {{- if .Values.secrets.botApiKey }}
  VEXA_BOT_API_KEY: {{ .Values.secrets.botApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicAuthToken }}
  ANTHROPIC_AUTH_TOKEN: {{ .Values.secrets.anthropicAuthToken | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicBaseUrl }}
  ANTHROPIC_BASE_URL: {{ .Values.secrets.anthropicBaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.claudeCodeOauthToken }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.secrets.claudeCodeOauthToken | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.postgres.enabled (not .Values.postgres.existingCredentialsSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.credentialsSecretName | default "postgres-credentials" }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | default "postgres" | quote }}
{{- end }}

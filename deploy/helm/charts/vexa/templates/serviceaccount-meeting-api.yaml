{{- if and .Values.meetingApi.enabled .Values.meetingApi.serviceAccount.create }}
# Optional dedicated ServiceAccount for meeting-api — lets IRSA (eks.amazonaws.com/role-arn) grant
# meeting-api its own AWS IAM role instead of running as the namespace default account. Same
# pattern as the runtime's SA (rbac-runtime.yaml), but no Role/RoleBinding: meeting-api talks to
# AWS (e.g. S3), not the Kubernetes API, so it needs no in-cluster RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.meetingApi.serviceAccount.name | default (include "vexa.componentName" (list . "meeting-api")) }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
  {{- with .Values.meetingApi.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
